alias: "📊 Zigbee : Rapport Journalier (Simplifié)"
description: >-
  Version simplifiée : notification persistante HA uniquement.
  Envoie un bilan des piles ET des appareils offline (réseau) chaque soir à 20h.

triggers:
  # Rapport programmé
  - trigger: time
    at: "20:30:00"
    id: scheduled

  # Vérification au démarrage de Home Assistant
  - trigger: homeassistant
    event: start
    id: ha_start

  # Alerte immédiate si une batterie passe sous le seuil
  - trigger: state
    entity_id: sensor.zigbee_battery_alerts
    not_from:
      - "unknown"
      - "unavailable"
    for: "00:01:00"
    id: battery_alert

  # Alerte immédiate si un appareil devient offline
  - trigger: state
    entity_id: sensor.z2m_network_monitor
    not_from:
      - "unknown"
      - "unavailable"
    for: "00:01:00"
    id: network_alert

conditions:
  # Filtre anti-spam : On ne notifie que si ça empire ou si c'est résolu (0)
  # On ignore les améliorations partielles (ex: 14 -> 13 défauts)
  - condition: template
    value_template: >
      {% if trigger.id == 'scheduled' or trigger.id == 'ha_start' %}
        true
      {% elif trigger.id in ['battery_alert', 'network_alert'] %}
        {% set from_val = trigger.from_state.state | int(0) %}
        {% set to_val = trigger.to_state.state | int(0) %}
        {# On notifie si pire (to > from) OU si tout résolu (to == 0) #}
        {{ to_val > from_val or to_val == 0 }}
      {% else %}
        true
      {% endif %}

actions:
  # --- GESTION DU DÉMARRAGE HA (Délai d'initialisation) ---
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'ha_start' }}"
        sequence:
          # On laisse 5 minutes au réseau Zigbee pour s'initialiser et remonter les états
          - delay: "00:05:00" 

  # Si c'était un boot HA, on arrête là si aucun appareil n'est hors-ligne
  - condition: template
    value_template: >
      {% if trigger.id == 'ha_start' %}
        {{ states('sensor.z2m_network_monitor') | int(0) > 0 }}
      {% else %}
        true
      {% endif %}
  # Variables communes
  - variables:
      battery_count: "{{ states('sensor.zigbee_battery_alerts') | int(0) }}"
      network_count: "{{ states('sensor.z2m_network_monitor') | int(0) }}"
      battery_devices: "{{ states('sensor.z2m_battery_devices') | int(0) }}"
      total_zigbee: "{{ state_attr('sensor.z2m_battery_devices', 'raw_devices') | default([]) | length }}"
      has_alerts: "{{ battery_count > 0 or network_count > 0 }}"
      trigger: >
        ---
        🔍 **DÉCLENCHEUR** : `{{ trigger.id if trigger is defined else 'N/A' }}`
        {% if trigger is defined and trigger.platform == 'state' %}
        `{{ trigger.entity_id }}` : {{ trigger.from_state.state }} ➡️ {{ trigger.to_state.state }}
        {% endif %}

  # Choix selon présence d'alertes ou non
  - choose:
      # CAS 1 : Il y a des alertes
      - conditions:
          - condition: template
            value_template: "{{ has_alerts }}"
        sequence:
          - variables:
              # Liste des alertes batteries
              battery_list: >
                {% set devices = state_attr('sensor.zigbee_battery_alerts', 'alert_devices') | default([]) %}
                {% set report = namespace(text="") %}
                {% for d in devices %}
                  {% set info = "" %}
                  {% if d.battery == '?' %}
                    {% set info = "❓ BATTERIE INCONNUE" %}
                  {% else %}
                    {% set info = "🪫 BATTERIE " ~ d.battery ~ "%" %}
                  {% endif %}
                  {% set report.text = report.text ~ "• " ~ d.name ~ " : " ~ info ~ " (Maintenance : " ~ d.maintenance ~ ")\n" %}
                {% endfor %}
                {{ report.text }}
              
              # Liste des appareils offline (réseau)
              network_list: >
                {% set devices = state_attr('sensor.z2m_network_monitor', 'offline_list') | default([]) %}
                {% set report = namespace(text="") %}
                {% for d in devices %}
                  {% set time_str = d.hours_ago ~ "h" if d.hours_ago != 'N/A' else "peu de temps" %}
                  {% set maint_str = " (Maintenance : " ~ d.maint ~ ")" if d.maint is defined and d.maint != 'jamais' else "" %}
                  {% set report.text = report.text ~ "• " ~ d.name ~ " : 📡 SILENCIEUX depuis " ~ time_str ~ maint_str ~ "\n" %}
                {% endfor %}
                {{ report.text }}
              
              # Message complet formaté
              message: |
                � Réseau : {{ total_zigbee }} appareils Zigbee ({{ battery_devices }} sur batterie)

                �🔋 BATTERIES ({{ battery_count }} alerte{{ 's' if battery_count > 1 else '' }})
                {{ battery_list if battery_count > 0 else '✅ Aucune alerte' }}

                📡 RÉSEAU ({{ network_count }} silencieux)
                {{ network_list if network_count > 0 else '✅ Tous les appareils communiquent' }}

                {{ trigger }}

          - action: persistent_notification.create
            data:
              title: "🚨 Rapport Zigbee - {{ battery_count + network_count }} alerte(s)"
              message: "{{ message }}"
              notification_id: "zigbee_report_{{ now().strftime('%Y%m%d_%H%M%S') }}"

    # CAS 2 : Tout va bien !
    default:
      - variables:
          message: |
            ✅ Tous les systèmes sont opérationnels !
            
            📊 Réseau : {{ total_zigbee }} appareils Zigbee
            • 🔋 {{ battery_devices }} sur batterie surveillés
            • ✅ 0 alerte batterie
            • 📡 0 appareil silencieux

            {{ trigger }}

      - action: persistent_notification.create
        data:
          title: "✅ Rapport Zigbee - Tout OK"
          message: "{{ message }}"
          notification_id: "zigbee_report_{{ now().strftime('%Y%m%d_%H%M%S') }}"

mode: queued
max: 5
