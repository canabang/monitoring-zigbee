alias: "📊 Zigbee : Rapport Journalier V2"
description: >-
  Envoie un bilan des piles ET des appareils offline (réseau) chaque soir à 20h.
  Utilise des trigger_id pour différencier les sources d'alerte.

triggers:
  # Rapport programmé - vérifie les deux types d'alertes
  - trigger: time
    at: "20:00:00"
    id: scheduled

  # Boucle de rappel toutes les 2 heures
  - trigger: time_pattern
    hours: "/2"
    id: loop_alert

  # Vérification au démarrage de Home Assistant
  - trigger: homeassistant
    event: start
    id: ha_start

  # Alerte immédiate si une batterie passe sous le seuil
  - trigger: state
    entity_id: sensor.zigbee_battery_alerts
    not_from:
      - "unknown"
      - "unavailable"
    for: "00:01:00"
    id: battery_alert

  # Alerte immédiate si un appareil devient offline
  - trigger: state
    entity_id: sensor.z2m_network_monitor
    not_from:
      - "unknown"
      - "unavailable"
    for: "00:01:00"
    id: network_alert

conditions:
  # Filtre anti-spam : On ne notifie que si ça empire ou si c'est résolu (0)
  # On ignore les améliorations partielles (ex: 14 -> 13 défauts)
  - condition: template
    value_template: >
      {% if trigger.id == 'scheduled' or trigger.id == 'ha_start' %}
        true
      {% elif trigger.id == 'loop_alert' %}
        {# La boucle de 2h passe UNIQUEMENT s'il y a des appareils hors-ligne #}
        {{ states('sensor.z2m_network_monitor') | int(0) > 0 }}
      {% elif trigger.id in ['battery_alert', 'network_alert'] %}
        {% set from_val = trigger.from_state.state | int(0) %}
        {% set to_val = trigger.to_state.state | int(0) %}
        {# On notifie si pire (to > from) OU si tout résolu (to == 0) #}
        {{ to_val > from_val or to_val == 0 }}
      {% else %}
        true
      {% endif %}

actions:
  # --- GESTION DU DÉMARRAGE HA (Délai d'initialisation) ---
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'ha_start' }}"
        sequence:
          # On laisse 5 minutes au réseau Zigbee pour s'initialiser et remonter les états
          - delay: "00:05:00" 

  # Si c'était un boot HA, on arrête là si aucun appareil n'est hors-ligne
  - condition: template
    value_template: >
      {% if trigger.id == 'ha_start' %}
        {{ states('sensor.z2m_network_monitor') | int(0) > 0 }}
      {% else %}
        true
      {% endif %}
  # Variables communes
  - variables:
      battery_count: "{{ states('sensor.zigbee_battery_alerts') | int(0) }}"
      network_count: "{{ states('sensor.z2m_network_monitor') | int(0) }}"
      battery_devices: "{{ states('sensor.z2m_battery_devices') | int(0) }}"
      total_zigbee: "{{ state_attr('sensor.z2m_battery_devices', 'raw_devices') | default([]) | length }}"
      has_alerts: "{{ battery_count > 0 or network_count > 0 }}"
      debug_info: >
        ---
        🔍 **DEBUG** : `{{ trigger.id if trigger is defined else 'N/A' }}`
        {% if trigger is defined and trigger.platform == 'state' %}
        `{{ trigger.entity_id }}` : {{ trigger.from_state.state }} ➡️ {{ trigger.to_state.state }}
        {% endif %}

  # Choix selon présence d'alertes ou non
  - choose:
      # CAS 1 : Il y a des alertes
      - conditions:
          - condition: template
            value_template: "{{ has_alerts }}"
        sequence:
          # Construire les listes d'alertes
          - variables:
              battery_list: >
                {% set devices = state_attr('sensor.zigbee_battery_alerts', 'alert_devices') | default([]) %}
                {% set report = namespace(text="") %}
                {% for d in devices %}
                  {% set info = "" %}
                  {% if d.battery == '?' %}
                    {% set info = "❓ **BATTERIE INCONNUE**" %}
                  {% else %}
                    {% set info = "🪫 **BATTERIE " ~ d.battery ~ "%**" %}
                  {% endif %}
                  {% set report.text = report.text ~ "- " ~ d.name ~ " : " ~ info ~ " (Maintenance : *" ~ d.maintenance ~ "*)\n" %}
                {% endfor %}
                {{ report.text }}
              
              network_list: >
                {% set devices = state_attr('sensor.z2m_network_monitor', 'offline_list') | default([]) %}
                {% set report = namespace(text="") %}
                {% for d in devices %}
                  {% set time_str = d.hours_ago ~ "h" if d.hours_ago != 'N/A' else "peu de temps" %}
                  {% set maint_str = " (Maintenance : *" ~ d.maint ~ "*)" if d.maint is defined and d.maint != 'jamais' else "" %}
                  {% set report.text = report.text ~ "- " ~ d.name ~ " : 📡 **SILENCIEUX** depuis " ~ time_str ~ maint_str ~ "\n" %}
                {% endfor %}
                {{ report.text }}
              
              alert_summary: >
                {% set parts = [] %}
                {% if battery_count > 0 %}
                  {% set parts = parts + [battery_count ~ " alerte(s) batterie"] %}
                {% endif %}
                {% if network_count > 0 %}
                  {% set parts = parts + [network_count ~ " appareil(s) silencieux"] %}
                {% endif %}
                {{ parts | join(" et ") }}

          # Message K-2SO mode alerte
          - action: script.k_2so_generateur_de_message
            data:
              mission: rapport_zigbee
              details: "{{ alert_summary }}"
              consigne: >-
                Fais une courte introduction sarcastique (2-3 phrases) sur
                l'incompétence de l'humain à gérer son réseau Zigbee. Ne liste pas les appareils
                toi-même, je vais les ajouter après.
            response_variable: generated_message

          # Notifications alertes
          - parallel:
              - action: script.notification_discord
                data:
                  nom: 📊 Rapport Santé Zigbee
                  description: |
                    {{ generated_message.data }}

                    **📊 Réseau : {{ total_zigbee }} appareils Zigbee ({{ battery_devices }} sur batterie)**

                    **🔋 Batteries ({{ battery_count }} alerte{{ 's' if battery_count > 1 else '' }}) :**
                    {{ battery_list if battery_count > 0 else '✅ Aucune alerte' }}

                    **📡 Réseau ({{ network_count }} silencieux) :**
                    {{ network_list if network_count > 0 else '✅ Tous les appareils communiquent' }}

              - action: script.awtrix_dynamique_customapp_and_notify
                data:
                  message: "Zigbee: {{ battery_count }} piles, {{ network_count }} offline"
                  icone: warning
                  color: "{{ '#FF0000' if network_count > 0 else '#FFA500' }}"
                  rainbow: "false"
                  scrollspeed: "50"
                  duree: "25"

    # CAS 2 : Tout va bien !
    default:
      - action: script.k_2so_generateur_de_message
        data:
          mission: rapport_zigbee
          details: "{{ total_zigbee }} appareils Zigbee dont {{ battery_devices }} sur batterie, tous opérationnels"
          consigne: >-
            Fais un court message satisfait (1-2 phrases) sur le fait que tous les
            appareils Zigbee fonctionnent parfaitement. Reste dans le personnage K-2SO,
            tu peux être surpris ou suspicieux que tout aille bien.
        response_variable: generated_message

      - parallel:
          - action: script.notification_discord
            data:
              nom: ✅ Rapport Santé Zigbee
              description: |
                {{ generated_message.data }}

                **📊 Réseau : {{ total_zigbee }} appareils Zigbee**
                • 🔋 **{{ battery_devices }}** sur batterie surveillés
                • ✅ **0** alerte batterie
                • 📡 **0** appareil silencieux

          - action: script.awtrix_dynamique_customapp_and_notify
            data:
              message: "Zigbee: Tout OK!"
              icone: checkmark
              color: "#00FF00"
              rainbow: "false"
              scrollspeed: "50"
              duree: "15"

  # --- DEBUG LOG AUTOMATIQUE (Cumulatif) ---
  - service: persistent_notification.create
    data:
      title: "🔍 Debug Zigbee : {{ now().strftime('%H:%M:%S') }}"
      message: "{{ debug_info }}"
      # ID unique basé sur le timestamp pour empiler les notifs (historique)
      notification_id: "zigbee_debug_{{ as_timestamp(now()) }}"

mode: queued
max: 5
