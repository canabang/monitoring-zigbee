type: grid
cards:
  - square: false
    type: grid
    cards:
      - type: markdown
        content: >
          ## 📊 Monitoring Zigbee

          *Dernière vérification : {{ state_attr('sensor.z2m_battery_devices',
          'last_check') | as_timestamp | timestamp_custom('%d/%m/%Y %H:%M') }}*
        text_only: true
      - type: tile
        entity: button.actualiser_monitoring_zigbee
        name: Actualiser
        icon: mdi:refresh
        vertical: false
        hide_state: true
        color: primary
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.actualiser_monitoring_zigbee
      - type: markdown
        title: 🔋 État des Piles Zigbee
        icon: mdi:battery-check
        content: >
          {% set devices = state_attr('sensor.z2m_battery_devices', 'devices')
          %} {% set ns = namespace(alerts=[], ok=[]) %} {% for d in devices if
          devices %}
            {% if d.status == 'online' %}
              {% set bat_str = d.battery | string %}
              {% set is_unknown = bat_str in ['?', 'unknown', 'unavailable', 'None'] %}
              {% set bat_val = bat_str | replace('~', '') | float(999) if not is_unknown else 999 %}
              {% if is_unknown or (bat_val < 20) %}
                {% set ns.alerts = ns.alerts + [{'name': d.name, 'bat_display': d.battery if not is_unknown else '?', 'bat_val': bat_val, 'status': d.status, 'maint': d.maintenance}] %}
              {% else %}
                {% set ns.ok = ns.ok + [{'name': d.name, 'bat_display': d.battery, 'bat_val': bat_val, 'status': d.status, 'maint': d.maintenance}] %}
              {% endif %}
            {% endif %}
          {% endfor %}

          {% if ns.alerts | length > 0 %}

          ### 🚨 À Vérifier ({{ ns.alerts | length }})

          | Appareil | Problème | Batterie | Date |

          | :--- | :--- | :---: | :--- |

          {% for d in ns.alerts | sort(attribute='bat_val') -%}

          | **{{ d.name }}** | {{ '⚠️ FAIBLE' if d.bat_val < 20 else '❓ INCONNU' }} | {{ d.bat_display
          }}% | {{ d.maint }} |

          {% endfor %}

          {% endif %}


          <details>
          <summary>✅ Opérationnels ({{ ns.ok | length }})</summary>


          | Appareil | Batterie | Maintenance |

          | :--- | :---: | :--- |

          {% for d in ns.ok | sort(attribute='bat_val') -%}

          | {{ d.name }} | 🔋 {{ d.bat_display }}% | {{ d.maint }} |

          {% endfor %}


          </details>
      - type: markdown
        title: 📡 Moniteur Réseau Zigbee
        icon: mdi:zigbee
        content: >
          {% set offline = state_attr('sensor.z2m_network_monitor',
          'offline_list') | default([]) %} {% set registry =
          state_attr('sensor.z2m_battery_devices', 'last_seen_registry') |
          default({}) %}

          {% if offline | length > 0 %}

          ### 🔴 Appareils Hors-Ligne ({{ offline | length }})

          | Appareil | Dernier signal | Absence |

          | :--- | :---: | :---: |

          {% for d in offline | sort(attribute='hours_ago', reverse=true) -%}

          | **{{ d.name }}** | {{ (d.last_seen | as_timestamp | timestamp_custom('%d/%m %H:%M')) if d.last_seen != 'Inconnu' else 'Inconnu' }} | {{ (d.hours_ago | round(0) | string ~ 'h') if d.hours_ago != 'N/A' else 'Inconnu' }} |

          {% endfor %}

          {% else %}

          ### ✅ Tous les appareils sont en ligne

          {% endif %}


          ---


          <details>

          {% set raw_devices_names = state_attr('sensor.z2m_battery_devices', 'raw_devices') | map(attribute='friendly_name') | list %}
          {% set ns = namespace(filtered=[]) %}
          {% for name, ts in registry.items() %}
            {% if name in raw_devices_names %}
              {% set ns.filtered = ns.filtered + [{'name': name, 'ts': ts}] %}
            {% endif %}
          {% endfor %}
          
          <summary>📋 Activité Récente ({{ ns.filtered | length }} appareils physiques)</summary>

          {% if ns.filtered | length > 0 %}

          | Appareil | Dernier signal ({{ ns.filtered | length }}) |

          | :--- | :---: |

          {% for item in (ns.filtered | sort(attribute='ts',
          reverse=true)) -%}

          | {{ item.name }} | {{ item.ts | as_timestamp | timestamp_custom('%d/%m %H:%M')
          }} |

          {% endfor %}

          {% else %}

          *En attente de trafic MQTT...*

          {% endif %}



          </details>
      - type: markdown
        title: 📡 Qualité Signal (LQI)
        icon: mdi:signal
        content: >
          {% set weak = state_attr('sensor.z2m_lqi_monitor', 'low_lqi_list') |
          default([], true) %}

          {% if weak | length > 0 %}

          ### ⚠️ Signal Faible ({{ weak | length }})

          | Appareil | LQI |

          | :--- | :---: |

          {% for d in weak | sort(attribute='lqi') -%}

          | **{{ d.name }}** | {{ d.lqi }} |

          {% endfor %}

          {% else %}

          ### ✅ Signal Excellent (>30)

          {% endif %}

          <details>
          <summary>🔍 Voir tous les signaux</summary>


          | Appareil | LQI |

          | :--- | :---: |

          {% set registry = state_attr('sensor.z2m_battery_devices', 'lqi_registry') | default({}, true) -%}

          {% for name, lqi in registry.items() | sort(attribute='1') -%}

          | **{{ name }}** | {{ lqi }} |

          {% endfor %}


          </details>
    columns: 2
    grid_options:
      columns: full
      rows: auto
column_span: 2
